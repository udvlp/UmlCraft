# cargo-about: third-party license notices shipped with every release package.
# Generate with `cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html`.

# All release targets, so one notice file covers every platform's dependencies.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crates (publish = false) are covered by LICENSE-MIT and LICENSE-APACHE.
private = { ignore = true }

accepted = [
    "Apache-2.0",
    "MIT",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
