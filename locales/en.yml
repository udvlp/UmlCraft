  privacy: Privacy
  "yes": Yes, look
  "no": "No"
  downloading: "Downloading %{version} …"
  progress: "Downloading %{version} … %{percent} %"
  failed: "Update %{version} (download failed)"
privacy:
  title: Privacy
  intro: "UmlCraft works offline and sends nothing anywhere, with one exception that you choose: the check for new versions."
  when_title: When
  when: "At its first start UmlCraft asks whether it may look for new versions. Only if you agree does it ask GitHub, at start and at most once a day. You can change your answer in Settings › Updates. \"Check for updates\" in About UmlCraft asks once, whenever you click it. UmlCraft downloads the new version itself only when you click \"Update\" or \"Install now\"."
  what_title: What is sent
  what: "A request to api.github.com for the latest release of UmlCraft. Like any connection, it shows GitHub your IP address and the time. The request names UmlCraft and its version. Nothing about you, your computer or your projects is sent. If you download a new version, UmlCraft fetches it and its checksums from github.com and its download servers; these requests, too, name only UmlCraft and its version. UmlCraft keeps only the date of the last check and the version found, in its settings file on your computer."
  who_title: Who receives it
  who: "GitHub, Inc. (USA), certified under the EU-US Data Privacy Framework. What GitHub does with the data is described in the GitHub General Privacy Statement on docs.github.com."
  basis_title: Why and on what basis
  basis: "To tell you about new versions, with your consent (Art. 6(1)(a) GDPR). You can withdraw it at any time in the settings; requests made before stay lawful."
  responsible_title: Responsible
  responsible: "Ulf Haueisen, c/o Heinrich-Kleyer-Schule, Kühhornshofweg 27, 60320 Frankfurt am Main, Germany, app@umlcraft.com. You have the rights of the GDPR, among them access, erasure and complaint to a supervisory authority. UmlCraft itself stores nothing about you; for what GitHub stores, ask GitHub."
  close: Close
