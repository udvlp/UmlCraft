tool_tip:
  associationClass: "An association with a class of its own: drag from one class to the other. The class joins the middle of the line with a dashed line"
  inputPin: "An input pin: click on or near an action. It belongs to the action and stays on its border"
  outputPin: "An output pin: click on or near an action. It belongs to the action and stays on its border"
  activityParameter: "An input or output of the whole activity: click near the frame's border. Without a frame the diagram gets one"
  activityConnector: "Continues a flow elsewhere: a flow into a connector goes on from the connector of the same name"
  submachineState: "A state standing for another state machine, chosen in its properties: at first the first other one of the project, or a new one"
  entryPoint: "An entry point: click on or near the border of a state, or near the frame for one of the whole state machine. It stays on that border"
  exitPoint: "An exit point: click on or near the border of a state, or near the frame for one of the whole state machine. It stays on that border"
  stubState: "A stub state: click inside a submachine state. It stands for a state of the submachine that transitions lead to or come from"
  stateInvariant: "A condition that holds on a lifeline at that moment: click the lifeline where it should be"
  termination: "Ends a lifeline with a cross: click the lifeline. Messages below it are not possible"
  durationConstraint: "How long it may take from one message to another: drag from the first message to the second"
  timeConstraint: "When a message may arrive: click the message"
  foundMessage: "A message from outside the diagram, such as the first call of a sequence: click the lifeline that receives it. Drag the dot to change its length and side"
  lostMessage: "A message whose receiver the diagram does not show, a reply at first: click the lifeline that sends it. Drag the dot to change its length and side"
  part: "A part of a class: click inside the class. It becomes an attribute of the class; its type says what it is"
  port: "A port: click on or near the border of a class or a part. A port of a part belongs to the class that is the part's type"
  erAssociativeEntity: "A relationship that is also an entity: entities take part in it, attributes belong to it"
  erPartialKeyAttribute: "Partial key of a weak entity: identifies it together with the key of its owner entity"
  erIdentifying: "Drag from the parent to the child: its key becomes part of the child's key, the child depends on it"
  erNonIdentifying: "Drag from the parent to the child: its key becomes a foreign key of the child"
  erManyToMany: "Drag from one entity to the other: each can have many of the other"
  erSubtype: "Drag from the supertype to the subtype: the subtype takes the supertype's key. Further subtypes join the same symbol"
  notation_chen: "Entities as boxes, attributes as ovals, relationships as diamonds"
  notation_ie: "Entities as tables with their columns, relationships as lines with crow's feet"
  notation_idef1x: "Entities as tables with their columns and types, relationships as lines with a dot at the child"
  erLine: "One line for everything: attribute to what it describes, relationship to an entity (with [0,n]), IS-A to a super- or subtype (the first one to the supertype)"
