  note_syntax_error: l'analyseur n'a pas pu lire ceci ; conservé comme instruction rouge désactivée
  note_using: using – la ressource est affectée, le corps est à sa place
  note_lock: lock – le corps est à sa place, le verrou en commentaire
  note_yield: yield n'a pas d'élément ; conservé tel qu'il est écrit
  note_goto: goto n'a pas d'élément ; conservé comme sortie avec son texte
  note_local_function: une fonction déclarée dans la méthode est laissée de côté
  note_with: with – le contexte est affecté, le corps est à sa place
  note_loop_else: le else de la boucle la suit ; il s'exécute aussi là après un break
  note_try_else: le else de try termine le bloc try
  note_nested_function: une fonction définie dans la fonction est laissée de côté
  note_conditional_branch: "#if : une seule branche est lue (la première, ou celle qui suit #if 0), les autres sont laissées de côté"
  note_case_break: "break quitte ici le switch ; conservé comme sortie, qui dans un structogramme quitte une boucle"
