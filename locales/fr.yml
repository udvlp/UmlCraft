  progress: "Téléchargement de %{version}… %{percent} %"
  failed: "Mise à jour %{version} (échec du téléchargement)"
privacy:
  title: Confidentialité
  intro: "UmlCraft fonctionne hors ligne et n'envoie rien nulle part, à une exception près, que vous choisissez : la recherche de nouvelles versions."
  when_title: Quand
  when: "Au premier démarrage, UmlCraft demande s'il peut rechercher de nouvelles versions. Ce n'est que si vous acceptez qu'il interroge GitHub, au démarrage et au plus une fois par jour. Vous pouvez modifier votre réponse dans Paramètres › Mises à jour. « Rechercher des mises à jour » dans « À propos d'UmlCraft » interroge GitHub une fois, chaque fois que vous cliquez dessus. UmlCraft ne télécharge la nouvelle version elle-même que lorsque vous cliquez sur « Mise à jour » ou « Installer maintenant »."
  what_title: Ce qui est envoyé
  what: "Une requête à api.github.com demandant la dernière version publiée d'UmlCraft. Comme toute connexion, elle indique à GitHub votre adresse IP et l'heure. La requête nomme UmlCraft et sa version. Rien sur vous, votre ordinateur ou vos projets n'est envoyé. Si vous téléchargez une nouvelle version, UmlCraft la récupère, ainsi que ses sommes de contrôle, sur github.com et ses serveurs de téléchargement ; ces requêtes, elles aussi, ne nomment qu'UmlCraft et sa version. UmlCraft conserve seulement la date de la dernière recherche et la version trouvée, dans son fichier de paramètres sur votre ordinateur."
  who_title: Qui les reçoit
  who: "GitHub, Inc. (États-Unis), certifiée au titre du cadre de protection des données UE–États-Unis (EU-US Data Privacy Framework). Ce que GitHub fait des données est décrit dans la déclaration de confidentialité de GitHub (GitHub General Privacy Statement) sur docs.github.com."
  basis_title: Pourquoi et sur quelle base
  basis: "Pour vous signaler les nouvelles versions, avec votre consentement (art. 6, paragraphe 1, point a), du RGPD). Vous pouvez le retirer à tout moment dans les paramètres ; les requêtes effectuées auparavant restent licites."
  responsible_title: Responsable
  responsible: "Ulf Haueisen, c/o Heinrich-Kleyer-Schule, Kühhornshofweg 27, 60320 Frankfurt am Main, Allemagne, app@umlcraft.com. C'est à cette adresse que le courrier concernant UmlCraft me parvient. La Heinrich-Kleyer-Schule ne fournit pas UmlCraft et n'en est pas responsable. Vous disposez des droits prévus par le RGPD, notamment le droit d'accès, le droit à l'effacement et le droit d'introduire une réclamation auprès d'une autorité de contrôle. UmlCraft lui-même ne conserve rien à votre sujet. Pour ce que conserve GitHub, adressez-vous à GitHub."
  close: Fermer
