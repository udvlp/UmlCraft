tool_tip:
  associationClass: "Une association dotée de sa propre classe : faites glisser d'une classe à l'autre. La classe est reliée au milieu de la ligne par une ligne pointillée"
  inputPin: "Une broche d'entrée : cliquez sur une action ou à proximité. Elle appartient à l'action et reste sur son bord"
  outputPin: "Une broche de sortie : cliquez sur une action ou à proximité. Elle appartient à l'action et reste sur son bord"
  activityParameter: "Une entrée ou une sortie de l'activité entière : cliquez près du bord du cadre. Sans cadre, le diagramme en reçoit un"
  activityConnector: "Poursuit un flot ailleurs : un flot qui entre dans un connecteur repart du connecteur de même nom"
  submachineState: "Un état qui représente une autre machine à états, choisie dans ses propriétés : par défaut la première autre machine du projet, ou une nouvelle"
  entryPoint: "Un point d'entrée : cliquez sur le bord d'un état ou à proximité, ou près du cadre pour un point de toute la machine à états. Il reste sur ce bord"
  exitPoint: "Un point de sortie : cliquez sur le bord d'un état ou à proximité, ou près du cadre pour un point de toute la machine à états. Il reste sur ce bord"
  stubState: "Un état souche : cliquez à l'intérieur d'un état sous-machine. Il représente un état de la sous-machine d'où partent ou vers lequel mènent des transitions"
  stateInvariant: "Une condition vraie sur une ligne de vie à ce moment-là : cliquez sur la ligne de vie à l'endroit voulu"
  termination: "Termine une ligne de vie par une croix : cliquez sur la ligne de vie. Aucun message n'est possible en dessous"
  durationConstraint: "Le temps que peut prendre le passage d'un message à un autre : faites glisser du premier message au second"
  timeConstraint: "Le moment où un message peut arriver : cliquez sur le message"
  constraint: "Une contrainte entre deux associations, par défaut {xor} (un objet participe à l'une d'elles, jamais aux deux) : faites glisser de la ligne d'une association à celle de l'autre"
  foundMessage: "Un message venant de l'extérieur du diagramme, comme le premier appel d'une séquence : cliquez sur la ligne de vie qui le reçoit. Faites glisser le point pour changer sa longueur et son côté"
  lostMessage: "Un message dont le diagramme ne montre pas le destinataire, par défaut un retour : cliquez sur la ligne de vie qui l'envoie. Faites glisser le point pour changer sa longueur et son côté"
  part: "Une partie d'une classe : cliquez à l'intérieur de la classe. Elle devient un attribut de la classe ; son type indique ce qu'elle est"
  port: "Un port : cliquez sur le bord d'une classe ou d'une partie, ou à proximité. Le port d'une partie appartient à la classe qui est le type de la partie"
  erAssociativeEntity: "Une association qui est aussi une entité : des entités y participent, des attributs lui appartiennent"
  erPartialKeyAttribute: "Clé partielle d'une entité faible : l'identifie conjointement avec la clé de son entité propriétaire"
  erIdentifying: "Faites glisser du parent à l'enfant : sa clé devient une partie de la clé de l'enfant, l'enfant dépend de lui"
  erNonIdentifying: "Faites glisser du parent à l'enfant : sa clé devient une clé étrangère de l'enfant"
  erManyToMany: "Faites glisser d'une entité à l'autre : chacune peut être liée à plusieurs occurrences de l'autre"
  erSubtype: "Faites glisser du surtype au sous-type : le sous-type reprend la clé du surtype. Les autres sous-types se rattachent au même symbole"
  notation_chen: "Entités en rectangles, attributs en ovales, associations en losanges"
  notation_ie: "Entités en tables avec leurs colonnes, associations en lignes avec pattes de corbeau"
  notation_idef1x: "Entités en tables avec leurs colonnes et leurs types, associations en lignes avec un point du côté de l'enfant"
  erLine: "Une ligne pour tout : d'un attribut à ce qu'il décrit, d'une association à une entité (avec [0,n]), d'un IS-A à un surtype ou à un sous-type (la première vers le surtype)"
