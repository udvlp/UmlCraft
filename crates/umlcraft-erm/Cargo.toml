[package]
name = "umlcraft-erm"
description = "Entity-relationship diagrams in Chen notation, drawn like draw.io's ER shapes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# Without float_roundtrip serde_json may read 15.6254 as 15.625399999999999, and a file
# written again would change.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
# The comparison with draw.io reads its files and SVG images and rasterizes ours.
quick-xml.workspace = true
resvg.workspace = true

[lints]
workspace = true
