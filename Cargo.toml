[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
umlcraft-model = { path = "crates/umlcraft-model" }
umlcraft-format = { path = "crates/umlcraft-format" }
umlcraft-notation = { path = "crates/umlcraft-notation" }
umlcraft-asta = { path = "crates/umlcraft-asta" }
umlcraft-asta-export = { path = "crates/umlcraft-asta-export" }

# gpui-kit pins the matching GPUI release (gpui-pre) together with gpui-component.
gpui-kit = "=0.8.0"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v7", "serde"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
pretty_assertions = "1"
rust-i18n = "4"
sys-locale = "0.3"
# PNG export rasterizes the SVG export; diagrams contain no raster images.
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Font metrics for comparing SVG exports with Astah's outside the app.
ttf-parser = "0.25"
# Reading Astah files only needs inflate; zopfli would only help writing.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# GPUI is slow unoptimized; optimize dependencies, keep our crates fast to build.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
