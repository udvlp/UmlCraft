[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.17.0"
edition = "2024"
# Named in the About dialog; the copyright holders behind "The UmlCraft authors" in LICENSE-MIT.
authors = ["Ulf Haueisen", "Steven Gast"]
# The dependencies need 1.92 (oo7); UmlCraft itself needs let chains (1.88).
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
umlcraft-model = { path = "crates/umlcraft-model" }
umlcraft-format = { path = "crates/umlcraft-format" }
umlcraft-notation = { path = "crates/umlcraft-notation" }
umlcraft-asta = { path = "crates/umlcraft-asta" }
umlcraft-asta-export = { path = "crates/umlcraft-asta-export" }
umlcraft-reverse = { path = "crates/umlcraft-reverse" }
umlcraft-nsd = { path = "crates/umlcraft-nsd" }
umlcraft-nsd-code = { path = "crates/umlcraft-nsd-code" }
umlcraft-mcp = { path = "crates/umlcraft-mcp" }
umlcraft-screenshot = { path = "crates/umlcraft-screenshot" }

# gpui-kit pins the matching GPUI release (gpui-pre) together with gpui-component.
gpui-kit = "=0.8.1"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-channel = "2"
pretty_assertions = "1"
# Reads Structorizer's .nsd files; they are written by hand to match Structorizer byte for byte.
quick-xml = "0.42"
rust-i18n = "4"
sys-locale = "0.3"
# Structograms record the local date they are saved on (GPUI pulls chrono in anyway).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Structograms in the app hand rasterized images to GPUI as image frames.
image = { version = "0.25", default-features = false }
# PNG export rasterizes the SVG export; diagrams contain no raster images.
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# The app's own icons (assets/icons), embedded in umlcraft.exe.
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude"] }
# The app icon in umlcraft.exe.
embed-resource = "3"
# The MCP server's screenshot of the app window: the window's handle (as GPUI gives it) and the
# Win32 calls that capture it. GPUI pulls in both, in these versions.
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# The optional update check asks GitHub for the latest release, over rustls with the platform's
# certificates (no bundled root list).
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
semver = "1"
# Checks a downloaded update against the release's SHA256SUMS.txt.
sha2 = "0.10"
# Font metrics for comparing SVG exports with Astah's outside the app.
ttf-parser = "0.25"
# Source import parses declarations with tree-sitter grammars (built from C by `cc`).
tree-sitter = "0.27"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-python = "0.25"
# Source files in legacy encodings (Windows-1252, UTF-16).
encoding_rs = "0.8"
# Reading Astah files only needs inflate; zopfli would only help writing.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# GPUI is slow unoptimized; optimize dependencies, keep our crates fast to build.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
