# Builds the release packages for Windows, Linux (.tar.gz, .deb, .rpm, AppImage, Flatpak, Snap)
# and macOS.
#
# Pushing a tag `vX.Y.Z` (matching the workspace version) builds everything and creates a draft
# GitHub release with the packages attached. Running the workflow by hand only builds the packages
# and keeps them as workflow artifacts, to try packaging without a release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Read the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "umlcraft-app") | .version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          # The Linux packages take their release information from the AppStream metadata.
          metainfo=packaging/linux/com.umlcraft.app.metainfo.xml
          if ! grep -q "<release version=\"$version\"" "$metainfo"; then
            echo "::error::$metainfo lists no <release version=\"$version\">"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-about
      - run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licenses
          path: THIRD-PARTY-LICENSES.html

  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  # The builds start beside the checks instead of after them; `publish` waits for both.
  build:
    name: Package (${{ matrix.name }})
    needs: [version, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: macOS universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      # A tag's run cannot restore what another tag's run saved, only caches of main: the
      # dependencies come from the cache that release-cache.yml keeps there. Its key tells the
      # runners apart by their Rust environment.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses

      - name: Build
        run: |
          IFS=, read -ra targets <<< "${{ matrix.targets }}"
          for target in "${targets[@]}"; do
            cargo build --release --locked -p umlcraft-app -p umlcraft-cli --target "$target"
          done

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: |
          name="UmlCraft-$VERSION-windows-x64"
          mkdir -p "dist/$name"
          cp target/x86_64-pc-windows-msvc/release/umlcraft.exe \
            target/x86_64-pc-windows-msvc/release/umlcraft-cli.exe "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html "dist/$name/"
          (cd dist && 7z a -tzip "$name.zip" "$name")

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $innoSetup = "$env:RUNNER_TEMP\innosetup-7.1.1-x64.exe"
          Invoke-WebRequest -OutFile $innoSetup `
            https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
          $hash = '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0'
          if ((Get-FileHash $innoSetup -Algorithm SHA256).Hash -ne $hash) {
            throw 'The Inno Setup download is not the expected file.'
          }
          Start-Process $innoSetup -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES',
            '/NORESTART', '/SP-', "/DIR=$env:RUNNER_TEMP\InnoSetup"
          & "$env:RUNNER_TEMP\InnoSetup\ISCC.exe" /Qp "/DVersion=$env:VERSION" `
            "/DSource=$PWD\dist\UmlCraft-$env:VERSION-windows-x64" "/O$PWD\dist" `
            packaging\windows\umlcraft.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Installs for the current user, as by default, checks the program and its file type,
      # and uninstalls again.
      - name: Try the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process "dist\UmlCraft-$env:VERSION-windows-x64-setup.exe" -Wait -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER'
          $dir = "$env:LOCALAPPDATA\Programs\UmlCraft"
          if (-not (Test-Path "$dir\umlcraft.exe")) { throw "umlcraft.exe is not in $dir" }
          if (-not (Test-Path "$dir\umlcraft-cli.exe")) { throw "umlcraft-cli.exe is not in $dir" }
          $open = 'HKCU:\Software\Classes\UmlCraft.Project\shell\open\command'
          $command = (Get-Item $open).GetValue('')
          if ($command -ne "`"$dir\umlcraft.exe`" `"%1`"") { throw "Unexpected command: $command" }
          if ((Get-Item 'HKCU:\Software\Classes\.ucraft').GetValue('') -ne 'UmlCraft.Project') {
            throw '.ucraft is not associated'
          }
          # The uninstaller runs from a copy and returns at once; wait for it to finish.
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES',
            '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep 1 }
          if (Test-Path $dir) { throw "Uninstalling left $dir behind" }
          if (Test-Path 'HKCU:\Software\Classes\UmlCraft.Project') {
            throw 'Uninstalling left the file type behind'
          }

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          app="dist/dmg/UmlCraft.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/umlcraft" \
            target/aarch64-apple-darwin/release/umlcraft \
            target/x86_64-apple-darwin/release/umlcraft
          lipo -create -output "$app/Contents/MacOS/umlcraft-cli" \
            target/aarch64-apple-darwin/release/umlcraft-cli \
            target/x86_64-apple-darwin/release/umlcraft-cli
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp packaging/macos/UmlCraft.icns LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html \
            "$app/Contents/Resources/"
          # Ad-hoc signature: not a Developer ID, but Apple Silicon refuses unsigned code.
          # The MCP server inside first, as the bundle's signature covers it.
          codesign --force --sign - "$app/Contents/MacOS/umlcraft-cli"
          codesign --force --sign - "$app"
          ln -s /Applications dist/dmg/Applications
          # hdiutil sizes the image from the folder and now and then too small ("No space left
          # on device"); a fixed size with room to spare avoids that.
          size=$(( $(du -sm dist/dmg | cut -f1) + 64 ))
          hdiutil create -volname UmlCraft -srcfolder dist/dmg -format UDZO -size "${size}m" \
            "dist/UmlCraft-$VERSION-macos-universal.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.dmg
          if-no-files-found: error

  # A job of its own, so that the Linux packages start while Windows still builds.
  build-linux:
    name: Package (Linux x64)
    needs: [version, licenses]
    # The oldest available Ubuntu keeps the glibc requirement low.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GPUI build dependencies
        run: bash packaging/linux/install-build-deps.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      # See `build`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses

      - name: Build
        run: >-
          cargo build --release --locked -p umlcraft-app -p umlcraft-cli
          --target x86_64-unknown-linux-gnu

      - name: Package for Linux
        run: |
          name="UmlCraft-$VERSION-linux-x64"
          mkdir -p "dist/$name"
          cp target/x86_64-unknown-linux-gnu/release/umlcraft \
            target/x86_64-unknown-linux-gnu/release/umlcraft-cli "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Keep the Linux binary for the Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-binary
          path: |
            target/x86_64-unknown-linux-gnu/release/umlcraft
            target/x86_64-unknown-linux-gnu/release/umlcraft-cli
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-Linux
          path: dist/*.tar.gz
          if-no-files-found: error

  # Packs the Linux binary from the build job, so every package runs the same program.
  linux-packages:
    name: Package (Linux deb, rpm, AppImage)
    needs: [version, build-linux]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NFPM_VERSION: 2.47.0
      NFPM_SHA256: 3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97
      APPIMAGETOOL_VERSION: 1.9.1
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_VERSION: "20251108"
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
      # appimagetool is an AppImage itself; the runner has no FUSE to mount it.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-binary
          path: dist/binary
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses

      - name: Install the packaging tools
        run: |
          curl -sSfL -o nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_amd64.deb"
          echo "$NFPM_SHA256  nfpm.deb" | sha256sum -c
          sudo apt-get update
          # patchelf and the xkbcommon libraries for the AppImage, which bundles them.
          sudo apt-get install -y --no-install-recommends ./nfpm.deb librsvg2-bin patchelf \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-xkb1
          curl -sSfL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c
          sudo install -m755 appimagetool /usr/local/bin/appimagetool
          curl -sSfL -o "$RUNNER_TEMP/appimage-runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-x86_64"
          echo "$APPIMAGE_RUNTIME_SHA256  $RUNNER_TEMP/appimage-runtime" | sha256sum -c
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"

      - name: Package deb and rpm
        run: |
          bash packaging/linux/install-desktop-files.sh dist/binary/umlcraft dist/linux/usr \
            dist/binary/umlcraft-cli
          for format in deb rpm; do
            nfpm package -f packaging/linux/nfpm.yaml -p "$format" \
              -t "dist/UmlCraft-$VERSION-linux-x64.$format"
          done

      # Named as the AppImage catalog asks, after the architecture only. The copy under the old
      # name serves the update of 0.21.0 and older, which looks for it; drop it once few run
      # those any more.
      - name: Package AppImage
        run: |
          bash packaging/linux/appimage.sh dist/binary/umlcraft \
            "dist/UmlCraft-$VERSION-x86_64.AppImage"
          cp "dist/UmlCraft-$VERSION-x86_64.AppImage" "dist/UmlCraft-$VERSION-linux-x64.AppImage"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Package (Linux Flatpak)
    needs: [version, build-linux]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-binary
          path: dist/binary

      - name: Package Flatpak
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --repo=repo build \
            packaging/linux/flatpak/com.umlcraft.app.yml
          # The runtime repository lets `flatpak install` fetch the runtime from Flathub.
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "dist/UmlCraft-$VERSION-linux-x64.flatpak" com.umlcraft.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  snap:
    name: Package (Linux Snap)
    needs: [version, build-linux]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-binary
          path: dist/binary

      # snapcraft builds in a container that sees only its project folder.
      - name: Put the binary into the snap project
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          bash packaging/linux/install-desktop-files.sh dist/binary/umlcraft \
            packaging/linux/snap-root/usr

      - name: Install snapcraft
        run: sudo snap install --classic snapcraft

      # Right on the runner instead of in an LXD container: the runner is Ubuntu 24.04 like
      # the snap's base core24, and it is thrown away afterwards. That saves fetching an Ubuntu
      # image and setting up LXD, which took most of the job.
      - name: Build the snap
        working-directory: packaging/linux
        run: sudo snapcraft --destructive-mode

      - name: Name the snap like the other packages
        run: |
          mkdir -p dist
          mv packaging/linux/*.snap "dist/UmlCraft-$VERSION-linux-x64.snap"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-snap
          path: dist/*.snap
          if-no-files-found: error

  publish:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [version, checks, build, build-linux, linux-packages, flatpak, snap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Create the draft release
        run: |
          sed "s/@VERSION@/$VERSION/g" packaging/release-notes.md > release-notes.md
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "UmlCraft $VERSION" \
            --notes-file ../release-notes.md --generate-notes \
            *
